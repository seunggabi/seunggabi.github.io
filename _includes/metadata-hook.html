<!-- Read marks: the reader marks a post as read with a button on the post page; marked posts are dimmed in every post list. Stored in localStorage only. -->
<style>
  .is-read { opacity: .55; }
  .is-read .card-title::after { content: " · 읽음"; font-size: .7em; font-weight: 400; }
  .read-toggle { margin: .75rem 0; }
  /* Sidebar section labels: 커리어 (resume, portfolio) and 글 찾기 (categories, tags, archives) */
  #sidebar li.nav-item:has(> a[href$="/resume/"])::before,
  #sidebar li.nav-item:has(> a[href$="/categories/"])::before {
    display: block;
    margin: 1rem 0 .25rem;
    padding: .75rem 0 0 1.5rem;
    border-top: 1px solid var(--sidebar-border-color, rgba(128, 128, 128, .25));
    font-size: .7rem;
    letter-spacing: .08em;
    opacity: .6;
  }
  #sidebar li.nav-item:has(> a[href$="/resume/"])::before { content: "커리어"; }
  #sidebar li.nav-item:has(> a[href$="/categories/"])::before { content: "글 찾기"; }
  .sidebar-intro { align-self: stretch; margin: 0; padding: 1.25rem 1rem 0 2.5rem; font-size: .8rem; line-height: 1.6; opacity: .7; }
  /* Wide screens: Chirpy caps the content at 1250px; use more of the width */
  @media all and (min-width: 1650px) {
    #main-wrapper > .container { max-width: 1500px; }
    #back-to-top { right: max(2rem, calc((100vw - 300px - 1500px) / 2 + 2rem)); }
  }
  #access-progress .progress { height: 4px; }
  /* Background music: a button that opens /music/ in a small window so playback survives page changes, plus a one-time nudge. */
  #music-btn {
    position: fixed; left: 1.25rem; bottom: 1.25rem; z-index: 1040;
    width: 2.75rem; height: 2.75rem; border-radius: 50%; border: 1px solid var(--btn-border-color, rgba(128,128,128,.3));
    background: var(--card-bg, #fff); color: var(--text-color, #333); box-shadow: 0 2px 8px rgba(0,0,0,.15); cursor: pointer;
  }
  #music-nudge {
    position: fixed; left: 1.25rem; bottom: 4.6rem; z-index: 1040; max-width: 15rem;
    padding: .7rem .85rem; border-radius: .6rem; font-size: .85rem; line-height: 1.5;
    background: var(--card-bg, #fff); color: var(--text-color, #333); border: 1px solid var(--btn-border-color, rgba(128,128,128,.3));
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  #music-nudge[hidden] { display: none; }
  #music-nudge .actions { margin-top: .5rem; display: flex; gap: .4rem; justify-content: flex-end; }
  #music-side { display: none; }
  @media all and (min-width: 850px) {
    #music-btn { display: none; }
    #music-side { display: inline-block; }
    #music-nudge { left: 1rem; bottom: 3.25rem; }
  }
  /* Color chips: tags get a hue from their name, categories from the top-level category. --h is set by the script below. */
  .chip {
    background: hsl(var(--h) 70% 94%) !important;
    color: hsl(var(--h) 55% 30%) !important;
    border: 1px solid hsl(var(--h) 45% 82%) !important;
  }
  a.chip:hover { background: hsl(var(--h) 70% 88%) !important; }
  .post-meta .categories.chip { padding: 0 .45rem; border-radius: .6rem; font-size: .85em; }
  .card.categories.chip-card { border-left: 4px solid hsl(var(--h) 55% 55%) !important; }
  .card.categories.chip-card .card-header a { color: hsl(var(--h) 55% 32%); }
  html[data-mode="dark"] .chip { background: hsl(var(--h) 25% 20%) !important; color: hsl(var(--h) 70% 80%) !important; border-color: hsl(var(--h) 30% 32%) !important; }
  html[data-mode="dark"] a.chip:hover { background: hsl(var(--h) 25% 26%) !important; }
  html[data-mode="dark"] .card.categories.chip-card .card-header a { color: hsl(var(--h) 70% 78%); }
  @media (prefers-color-scheme: dark) {
    html:not([data-mode="light"]) .chip { background: hsl(var(--h) 25% 20%) !important; color: hsl(var(--h) 70% 80%) !important; border-color: hsl(var(--h) 30% 32%) !important; }
    html:not([data-mode="light"]) a.chip:hover { background: hsl(var(--h) 25% 26%) !important; }
    html:not([data-mode="light"]) .card.categories.chip-card .card-header a { color: hsl(var(--h) 70% 78%); }
  }
</style>
{% assign featured = "superset-epoch-us,spark-session-config-map,pyathena-complex-types,spark-streaming-to-hive" | split: "," %}
<template id="panel-extra">
  <section id="access-featured">
    <h2 class="panel-heading">먼저 볼 글</h2>
    <ul class="content list-unstyled ps-0 pb-1 ms-1 mt-2">
      {%- for slug in featured -%}
        {%- assign p = site.posts | where: "slug", slug | first -%}
        {%- if p %}
        <li class="text-truncate lh-lg"><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>
        {%- endif -%}
      {%- endfor %}
    </ul>
  </section>
  <section id="access-progress">
    <h2 class="panel-heading">읽은 글</h2>
    <div class="content ms-1 mt-2 mb-4">
      <div class="read-progress-text lh-lg"></div>
      <div class="progress"><div class="progress-bar"></div></div>
      <a class="d-inline-block mt-2" href="{{ '/archives/' | relative_url }}?unread=1">안 읽은 글만 보기</a>
    </div>
  </section>
</template>
<template id="music-extra">
  <button type="button" id="music-btn" aria-label="배경음악 창 열기" title="배경음악: Hans Zimmer - Time"><i class="fas fa-music"></i></button>
  <div id="music-nudge" role="dialog" aria-label="배경음악 안내" hidden>
    읽는 동안 Hans Zimmer의 Time을 틀어 둘까요? 작은 창에서 재생돼서 글을 옮겨도 이어집니다.
    <div class="actions">
      <button type="button" class="btn btn-sm btn-outline-secondary" data-music="close">괜찮아요</button>
      <button type="button" class="btn btn-sm btn-primary" data-music="play">재생</button>
    </div>
  </div>
</template>
{% if page.layout == 'home' %}
<template id="home-all-posts">
  <ul class="list-unstyled ps-0 home-unread-list">
    {%- for p in site.posts %}
    <li class="py-2 border-bottom"><a href="{{ p.url | relative_url }}">{{ p.title }}</a><div class="small text-muted">{{ p.date | date: "%Y-%m-%d" }}{% if p.categories.size > 0 %} · {{ p.categories | join: " / " }}{% endif %}</div></li>
    {%- endfor %}
  </ul>
</template>
{% endif %}
<template id="sidebar-extra">
  <p class="sidebar-intro">Data Engineer<br>Batch · Streaming · CDC · Lakehouse<br>Spark · Airflow · Kafka · Flink · EMR</p>
</template>
<script>
  (function () {
    var KEY = 'read-marks';
    var seen;
    try { seen = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return; }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(Array.from(seen))); } catch (e) {}
    }
    document.addEventListener('DOMContentLoaded', function () {
      /* Category hues follow the top-level categories in tech-map.md; tags hash into a fixed hue set.
         No line comments in this file: the theme compresses HTML onto one line. */
      var CAT_HUE = {
        'Ingestion & CDC': 25, 'Streaming': 205, 'Batch & Query': 265, 'Lakehouse & Storage': 165,
        'Orchestration': 42, 'Transformation & Modeling': 330, 'BI & Serving': 5, 'Data Quality': 130,
        'Platform & Infra': 225, 'AI & Tooling': 290, 'System Design': 185, 'Career': 95
      };
      var TAG_HUES = [5, 25, 42, 95, 130, 165, 185, 205, 225, 265, 290, 330];
      function tagHue(name) {
        var h = 0;
        for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return TAG_HUES[h % TAG_HUES.length];
      }
      function paint(el, hue) { el.classList.add('chip'); el.style.setProperty('--h', hue); }
      document.querySelectorAll('a.post-tag').forEach(function (a) { paint(a, tagHue(a.textContent.trim().toLowerCase())); });
      document.querySelectorAll('#tags a.tag').forEach(function (a) { paint(a, tagHue(a.firstChild.textContent.trim().toLowerCase())); });
      document.querySelectorAll('.post-meta .categories').forEach(function (s) {
        var hue = CAT_HUE[s.textContent.split(',')[0].trim()];
        if (hue !== undefined) paint(s, hue);
      });
      document.querySelectorAll('.card.categories').forEach(function (c) {
        var a = c.querySelector('.card-header a');
        var hue = a && CAT_HUE[a.textContent.trim()];
        if (hue !== undefined) { c.classList.add('chip-card'); c.style.setProperty('--h', hue); }
      });
      document.body.appendChild(document.getElementById('music-extra').content.cloneNode(true));
      var sideBottom = document.querySelector('#sidebar .sidebar-bottom');
      if (sideBottom) {
        var side = document.createElement('button');
        side.type = 'button';
        side.id = 'music-side';
        side.className = 'btn btn-link nav-link';
        side.setAttribute('aria-label', '배경음악 창 열기');
        side.title = '배경음악: Hans Zimmer - Time';
        side.innerHTML = '<i class="fas fa-music"></i>';
        var modeGroup = sideBottom.querySelector('.btn-group');
        if (modeGroup) { modeGroup.after(side); } else { sideBottom.prepend(side); }
      }
      var nudge = document.getElementById('music-nudge');
      function openMusic() {
        var w = window.open('', 'blog-music', 'width=380,height=300');
        if (!w) { window.open('{{ "/music/" | relative_url }}', '_blank'); return; }
        try { if (w.location.href === 'about:blank') w.location.href = '{{ "/music/" | relative_url }}'; } catch (e) {}
        w.focus();
      }
      function hideNudge() {
        nudge.hidden = true;
        try { sessionStorage.setItem('music-nudge', '1'); } catch (e) {}
      }
      document.getElementById('music-btn').onclick = function () { hideNudge(); openMusic(); };
      if (document.getElementById('music-side')) document.getElementById('music-side').onclick = function () { hideNudge(); openMusic(); };
      nudge.querySelector('[data-music="play"]').onclick = function () { hideNudge(); openMusic(); };
      nudge.querySelector('[data-music="close"]').onclick = hideNudge;
      var nudged = false;
      try { nudged = sessionStorage.getItem('music-nudge') === '1'; } catch (e) {}
      if (!nudged) {
        setTimeout(function () { if (nudge) nudge.hidden = false; }, 3000);
        setTimeout(function () { if (!nudge.hidden) hideNudge(); }, 15000);
      }
      var nav = document.querySelector('#sidebar nav');
      if (nav) nav.after(document.getElementById('sidebar-extra').content.cloneNode(true));
      var access = document.querySelector('#panel-wrapper .access');
      if (access) {
        access.prepend(document.getElementById('panel-extra').content.cloneNode(true));
        var total = {{ site.posts.size }};
        var n = Math.min(seen.size, total);
        access.querySelector('.read-progress-text').textContent = n + ' / ' + total + '편';
        access.querySelector('.progress-bar').style.width = (100 * n / total) + '%';
      }
      document.querySelectorAll('a[href*="/posts/"]').forEach(function (a) {
        var path = new URL(a.href, location.href).pathname;
        if (path !== location.pathname && seen.has(path)) {
          (a.closest('article.card') || a).classList.add('is-read');
        }
      });
      {% if page.layout == 'home' %}
      var homeList = document.getElementById('post-list');
      if (homeList) {
        var HOME_KEY = 'read-filter-unread';
        var pager = document.querySelector('nav[aria-label="Page Navigation"]') || document.querySelector('.pagination');
        var unreadWrap = document.getElementById('home-all-posts').content.cloneNode(true).firstElementChild;
        Array.from(unreadWrap.children).forEach(function (li) {
          if (seen.has(new URL(li.querySelector('a').href, location.href).pathname)) li.remove();
        });
        unreadWrap.hidden = true;
        var homeSw = document.createElement('label');
        homeSw.className = 'form-check form-switch mb-3';
        homeSw.innerHTML = '<input class="form-check-input" type="checkbox" role="switch"> <span class="form-check-label"></span>';
        homeSw.querySelector('span').textContent = '안 읽은 글만 보기 (' + unreadWrap.children.length + '편, 전체 페이지에서)';
        var homeBox = homeSw.querySelector('input');
        homeList.before(homeSw);
        homeList.after(unreadWrap);
        function applyHome() {
          unreadWrap.hidden = !homeBox.checked;
          homeList.style.display = homeBox.checked ? 'none' : '';
          if (pager) pager.style.display = homeBox.checked ? 'none' : '';
        }
        try { homeBox.checked = localStorage.getItem(HOME_KEY) === '1'; } catch (e) {}
        homeBox.onchange = function () {
          try { localStorage.setItem(HOME_KEY, homeBox.checked ? '1' : '0'); } catch (e) {}
          applyHome();
        };
        applyHome();
      }
      {% endif %}
      {% if page.layout == 'archives' or page.layout == 'tag' or page.layout == 'category' %}
      var FILTER_KEY = 'read-filter-unread';
      var list = document.querySelector('main .content') || document.querySelector('main');
      var items = Array.from(list.querySelectorAll('li')).filter(function (li) {
        var a = li.querySelector('a[href*="/posts/"]');
        return a && seen.has(new URL(a.href, location.href).pathname);
      });
      var onlyUnread = new URLSearchParams(location.search).has('unread');
      try { if (!onlyUnread) onlyUnread = localStorage.getItem(FILTER_KEY) === '1'; } catch (e) {}
      var sw = document.createElement('label');
      sw.className = 'form-check form-switch my-3';
      sw.innerHTML = '<input class="form-check-input" type="checkbox" role="switch"> <span class="form-check-label"></span>';
      var box = sw.querySelector('input');
      sw.querySelector('span').textContent = '안 읽은 글만 보기 (읽은 글 ' + items.length + '편 숨김)';
      list.prepend(sw);
      function applyFilter() {
        items.forEach(function (li) { li.style.display = box.checked ? 'none' : ''; });
        list.querySelectorAll('ul').forEach(function (ul) {
          var visible = Array.from(ul.children).some(function (li) { return li.style.display !== 'none'; });
          ul.style.display = visible ? '' : 'none';
          var head = ul.previousElementSibling;
          if (head && head.matches('time.year')) head.style.display = visible ? '' : 'none';
        });
      }
      box.checked = onlyUnread;
      box.onchange = function () {
        try { localStorage.setItem(FILTER_KEY, box.checked ? '1' : '0'); } catch (e) {}
        applyFilter();
      };
      applyFilter();
      {% endif %}
      {% if page.layout == 'post' %}
      var here = location.pathname;
      var buttons = [];
      function render() {
        var on = seen.has(here);
        buttons.forEach(function (b) {
          b.textContent = on ? '읽음 표시됨 (취소)' : '읽음으로 표시';
          b.className = 'read-toggle btn btn-sm ' + (on ? 'btn-secondary' : 'btn-outline-secondary');
          b.setAttribute('aria-pressed', on);
        });
      }
      function toggle() {
        if (seen.has(here)) { seen.delete(here); } else { seen.add(here); }
        save();
        render();
      }
      [document.querySelector('article header'), document.querySelector('article .content')].forEach(function (anchor, i) {
        if (!anchor) return;
        var b = document.createElement('button');
        b.type = 'button';
        b.onclick = toggle;
        if (i === 0) { anchor.appendChild(b); } else { anchor.after(b); }
        buttons.push(b);
      });
      render();
      {% endif %}
    });
  })();
</script>
