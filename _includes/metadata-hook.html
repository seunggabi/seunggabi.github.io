<!-- Read marks: the reader marks a post as read with a button on the post page; marked posts are dimmed in every post list. Stored in localStorage only. -->
<style>
  .is-read { opacity: .55; }
  .is-read .card-title::after { content: " · 읽음"; font-size: .7em; font-weight: 400; }
  .read-toggle { margin: .75rem 0; }
  /* Sidebar section labels: 커리어 (resume, portfolio) and 글 찾기 (categories, tags, archives) */
  #sidebar li.nav-item:has(> a[href$="/resume/"])::before,
  #sidebar li.nav-item:has(> a[href$="/categories/"])::before {
    display: block;
    margin: 1rem 0 .25rem;
    padding: .75rem 0 0 1.5rem;
    border-top: 1px solid var(--sidebar-border-color, rgba(128, 128, 128, .25));
    font-size: .7rem;
    letter-spacing: .08em;
    opacity: .6;
  }
  #sidebar li.nav-item:has(> a[href$="/resume/"])::before { content: "커리어"; }
  #sidebar li.nav-item:has(> a[href$="/categories/"])::before { content: "글 찾기"; }
  .sidebar-intro { align-self: stretch; margin: 0; padding: 1.25rem 1rem 0 2.5rem; font-size: .8rem; line-height: 1.6; opacity: .7; }
  /* Wide screens: Chirpy caps the content at 1250px; use more of the width */
  @media all and (min-width: 1650px) {
    #main-wrapper > .container { max-width: 1500px; }
    #back-to-top { right: max(2rem, calc((100vw - 300px - 1500px) / 2 + 2rem)); }
  }
  #access-progress .progress { height: 4px; }
  /* Color chips: tags get a hue from their name, categories from the top-level category. --h is set by the script below. */
  .chip {
    background: hsl(var(--h) 70% 94%) !important;
    color: hsl(var(--h) 55% 30%) !important;
    border: 1px solid hsl(var(--h) 45% 82%) !important;
  }
  a.chip:hover { background: hsl(var(--h) 70% 88%) !important; }
  .post-meta .categories.chip { padding: 0 .45rem; border-radius: .6rem; font-size: .85em; }
  .card.categories.chip-card { border-left: 4px solid hsl(var(--h) 55% 55%) !important; }
  .card.categories.chip-card .card-header a { color: hsl(var(--h) 55% 32%); }
  html[data-mode="dark"] .chip { background: hsl(var(--h) 25% 20%) !important; color: hsl(var(--h) 70% 80%) !important; border-color: hsl(var(--h) 30% 32%) !important; }
  html[data-mode="dark"] a.chip:hover { background: hsl(var(--h) 25% 26%) !important; }
  html[data-mode="dark"] .card.categories.chip-card .card-header a { color: hsl(var(--h) 70% 78%); }
  @media (prefers-color-scheme: dark) {
    html:not([data-mode="light"]) .chip { background: hsl(var(--h) 25% 20%) !important; color: hsl(var(--h) 70% 80%) !important; border-color: hsl(var(--h) 30% 32%) !important; }
    html:not([data-mode="light"]) a.chip:hover { background: hsl(var(--h) 25% 26%) !important; }
    html:not([data-mode="light"]) .card.categories.chip-card .card-header a { color: hsl(var(--h) 70% 78%); }
  }
</style>
{% assign featured = "superset-epoch-us,spark-session-config-map,pyathena-complex-types,spark-streaming-to-hive" | split: "," %}
<template id="panel-extra">
  <section id="access-featured">
    <h2 class="panel-heading">먼저 볼 글</h2>
    <ul class="content list-unstyled ps-0 pb-1 ms-1 mt-2">
      {%- for slug in featured -%}
        {%- assign p = site.posts | where: "slug", slug | first -%}
        {%- if p %}
        <li class="text-truncate lh-lg"><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>
        {%- endif -%}
      {%- endfor %}
    </ul>
  </section>
  <section id="access-progress">
    <h2 class="panel-heading">읽은 글</h2>
    <div class="content ms-1 mt-2 mb-4">
      <div class="read-progress-text lh-lg"></div>
      <div class="progress"><div class="progress-bar"></div></div>
    </div>
  </section>
</template>
<template id="sidebar-extra">
  <p class="sidebar-intro">Data Engineer<br>Batch · Streaming · CDC · Lakehouse<br>Spark · Airflow · Kafka · Flink · EMR</p>
</template>
<script>
  (function () {
    var KEY = 'read-marks';
    var seen;
    try { seen = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) { return; }
    function save() {
      try { localStorage.setItem(KEY, JSON.stringify(Array.from(seen))); } catch (e) {}
    }
    document.addEventListener('DOMContentLoaded', function () {
      /* Category hues follow the top-level categories in tech-map.md; tags hash into a fixed hue set.
         No line comments in this file: the theme compresses HTML onto one line. */
      var CAT_HUE = {
        'Ingestion & CDC': 25, 'Streaming': 205, 'Batch & Query': 265, 'Lakehouse & Storage': 165,
        'Orchestration': 42, 'Transformation & Modeling': 330, 'BI & Serving': 5, 'Data Quality': 130,
        'Platform & Infra': 225, 'AI & Tooling': 290, 'System Design': 185, 'Career': 95
      };
      var TAG_HUES = [5, 25, 42, 95, 130, 165, 185, 205, 225, 265, 290, 330];
      function tagHue(name) {
        var h = 0;
        for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
        return TAG_HUES[h % TAG_HUES.length];
      }
      function paint(el, hue) { el.classList.add('chip'); el.style.setProperty('--h', hue); }
      document.querySelectorAll('a.post-tag').forEach(function (a) { paint(a, tagHue(a.textContent.trim().toLowerCase())); });
      document.querySelectorAll('#tags a.tag').forEach(function (a) { paint(a, tagHue(a.firstChild.textContent.trim().toLowerCase())); });
      document.querySelectorAll('.post-meta .categories').forEach(function (s) {
        var hue = CAT_HUE[s.textContent.split(',')[0].trim()];
        if (hue !== undefined) paint(s, hue);
      });
      document.querySelectorAll('.card.categories').forEach(function (c) {
        var a = c.querySelector('.card-header a');
        var hue = a && CAT_HUE[a.textContent.trim()];
        if (hue !== undefined) { c.classList.add('chip-card'); c.style.setProperty('--h', hue); }
      });
      var nav = document.querySelector('#sidebar nav');
      if (nav) nav.after(document.getElementById('sidebar-extra').content.cloneNode(true));
      var access = document.querySelector('#panel-wrapper .access');
      if (access) {
        access.prepend(document.getElementById('panel-extra').content.cloneNode(true));
        var total = {{ site.posts.size }};
        var n = Math.min(seen.size, total);
        access.querySelector('.read-progress-text').textContent = n + ' / ' + total + '편';
        access.querySelector('.progress-bar').style.width = (100 * n / total) + '%';
      }
      document.querySelectorAll('a[href*="/posts/"]').forEach(function (a) {
        var path = new URL(a.href, location.href).pathname;
        if (path !== location.pathname && seen.has(path)) {
          (a.closest('article.card') || a).classList.add('is-read');
        }
      });
      {% if page.layout == 'post' %}
      var here = location.pathname;
      var buttons = [];
      function render() {
        var on = seen.has(here);
        buttons.forEach(function (b) {
          b.textContent = on ? '읽음 표시됨 (취소)' : '읽음으로 표시';
          b.className = 'read-toggle btn btn-sm ' + (on ? 'btn-secondary' : 'btn-outline-secondary');
          b.setAttribute('aria-pressed', on);
        });
      }
      function toggle() {
        if (seen.has(here)) { seen.delete(here); } else { seen.add(here); }
        save();
        render();
      }
      [document.querySelector('article header'), document.querySelector('article .content')].forEach(function (anchor, i) {
        if (!anchor) return;
        var b = document.createElement('button');
        b.type = 'button';
        b.onclick = toggle;
        if (i === 0) { anchor.appendChild(b); } else { anchor.after(b); }
        buttons.push(b);
      });
      render();
      {% endif %}
    });
  })();
</script>
