<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Time - Hans Zimmer</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; gap: 8px; padding: 10px;
    background: #14161a; color: #d6d9de; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; color: #f1f3f5; }
  header span { font-size: 12px; color: #8b9098; white-space: nowrap; }
  .frame { position: relative; flex: 1; min-height: 0; border-radius: 8px; overflow: hidden; background: #000; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  p { margin: 0; font-size: 12px; color: #8b9098; }
</style>
</head>
<body>
<header><h1>Time</h1><span>Hans Zimmer</span></header>
<div class="frame">
  <iframe id="player" title="Time - Hans Zimmer" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<p>이 창을 열어 두면 글을 옮겨도 계속 재생됩니다.</p>
<script>
  var VIDEO_ID = 'LqRZ2_w56U0';
  document.getElementById('player').src =
    'https://www.youtube.com/embed/' + VIDEO_ID + '?autoplay=1&loop=1&playlist=' + VIDEO_ID + '&rel=0&modestbranding=1';
</script>
</body>
</html>
