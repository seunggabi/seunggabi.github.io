name: "External Link Check"
on:
  schedule:
    # Mondays 00:00 UTC (09:00 KST)
    - cron: "0 0 * * 1"
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b
        env:
          JEKYLL_ENV: "production"

      # Only broken (4xx) external links fail the run. Bot-blocking codes and
      # transient server errors are ignored to avoid false alarms.
      - name: Check external links
        run: |
          bundle exec htmlproofer _site \
            \-\-no-enforce-https \
            \-\-only-4xx \
            \-\-ignore-status-codes "403,429,999" \
            \-\-ignore-urls "/^https:\/\/fonts\.g(static|oogleapis)\.com\/?$/,/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"
